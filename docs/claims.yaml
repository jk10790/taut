# Claims manifest
#
# Every behavioural promise made in README.md or docs/ is registered here and
# bound to a test that proves it. tests/claims/test_manifest.py enforces this
# in both directions:
#
#   * a claim with status "shipped" must name a test that exists and passes
#   * a claim with status "unimplemented" must NOT be asserted in the docs
#   * a claim with status "unverified" has a test that cannot run yet (it
#     needs recorded fixtures); it must NOT be asserted in the docs either,
#     and the status is cross-checked against whether those fixtures exist
#
# This file is the contract that stopped the documentation drifting from the
# code. If you want to claim something new in the README, add it here with a
# test first. If you cannot write the test, you cannot make the claim.
#
# Numbers are never hand-written: measured values come from
# tests/benchmarks/baseline.json, generated by `pytest tests/benchmarks -m bench`.

claims:
  # ---------------------------------------------------------------- cache --
  - id: cache.semantic.exact
    claim: Identical requests are served from cache without calling the provider.
    source: docs/capabilities.md
    test: tests/claims/test_documented_claims.py::test_cache_semantic_exact
    status: shipped

  - id: cache.semantic.similar
    claim: Near-identical intents hit the cache above the similarity threshold.
    source: README.md
    test: tests/claims/test_documented_claims.py::test_cache_semantic_similar
    status: shipped
    note: >
      The mechanism works, but measure before relying on it. At the shipped
      threshold of 0.95, recall against labelled paraphrase pairs is ~17% --
      only trivial rewordings hit. The classes overlap (worst paraphrase 0.879
      < worst near-miss 0.940), so no threshold is both safe and useful. See
      the limitation documented in docs/limitations.md and the strict xfail in
      tests/benchmarks/test_cache_precision.py.

  - id: cache.onnx_local
    claim: Embeddings run locally via ONNX with no PyTorch dependency.
    source: docs/capabilities.md
    test: tests/claims/test_documented_claims.py::test_cache_onnx_is_local_and_torch_free
    status: shipped

  - id: cache.faiss_memory
    claim: In-memory backend uses FAISS for vector search.
    source: docs/capabilities.md
    test: tests/claims/test_documented_claims.py::test_cache_faiss_memory_backend
    status: shipped

  - id: cache.redis_vector
    claim: Redis backend uses RediSearch KNN vector search.
    source: docs/capabilities.md
    test: tests/claims/test_documented_claims.py::test_cache_redis_vector_backend
    status: shipped

  - id: cache.namespace_isolation
    claim: Namespaces isolate cached answers between tenants.
    source: docs/capabilities.md
    test: tests/claims/test_documented_claims.py::test_cache_namespace_isolation
    status: shipped

  - id: cache.key_is_query
    claim: The cache embedding is built from the query, not the whole prompt.
    source: docs/integration.md
    test: tests/claims/test_documented_claims.py::test_cache_key_is_the_query_not_the_whole_prompt
