[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taut"
version = "0.1.0"
description = "AI Efficiency Middleware — Zero Waste Compute for LLM applications"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "taut contributors"}]
keywords = ["llm", "ai", "middleware", "optimization", "token", "compression", "caching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "litellm>=1.40.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
cache = ["onnxruntime>=1.16.0", "tokenizers>=0.15.0", "faiss-cpu>=1.8.0", "numpy>=1.26.0"]
proxy = ["fastapi>=0.111.0", "uvicorn>=0.30.0"]
redis = ["redis[search]>=5.0.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23.0", "pytest-benchmark>=4.0", "ruff>=0.4.0", "pyyaml>=6.0"]
all = ["taut[cache,proxy,redis,dev]"]

[project.scripts]
taut = "taut.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "--strict-markers"
markers = [
    "e2e: spins up live HTTP servers on localhost (slower, port-bound)",
    "bench: measured performance runs against the checked-in corpus",
    "costly: spends money against a real provider; never runs in CI",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# The benchmark corpus is input data, not source. Its contents are deliberately
# verbose and old-fashioned (docstrings, typing.Optional) because that is what
# the compressors are measured against -- linting it would defeat the purpose.
exclude = ["tests/benchmarks/corpus"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = [
    "E741",  # ambiguous variable names (l, I) -- present in vendored-style math code
    "B008",  # function call in default arg -- FastAPI idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F841"]  # tests intentionally bind values for readability
