name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - name: ruff check
        run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[cache,proxy,redis,dev]"
      - name: Unit + integration tests
        run: pytest -m "not e2e and not costly" -q
      - name: End-to-end proxy tests
        run: pytest -m e2e -q

  claims:
    # Every behavioural promise in README.md / docs/ must map to a passing test.
    # This job is what stops the documentation drifting from the code again.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[cache,proxy,redis,dev]"
      - name: Verify documented claims
        run: pytest tests/claims -q
      - name: Verify README numbers match measured benchmarks
        run: pytest tests/benchmarks -m bench -q
